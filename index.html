
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al Haiatul Ulya BD - পরীক্ষার ফলাফল</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }
    .container {
      max-width: 500px;
      background: white;
      padding: 20px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      background: #004080;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>পরীক্ষার ফলাফল দেখুন</h2>
    <input type="text" id="rollInput" placeholder="রোল নাম্বার লিখুন" />
    <br>
    <button onclick="showResult()">ফলাফল দেখুন</button>

    <div id="resultSection" class="result"></div>
  </div>

  <script>
    const results = {
      "1001": {
        name: "মাহমুদ হাসান",
        subjects: {
          "কুরআন": 85,
          "হাদীস": 78,
          "ফিকহ": 90,
          "আরবি সাহিত্য": 72,
          "উসুল": 80
        }
      },
      "1002": {
        name: "সাইফুল ইসলাম",
        subjects: {
          "কুরআন": 92,
          "হাদীস": 88,
          "ফিকহ": 85,
          "আরবি সাহিত্য": 75,
          "উসুল": 79
        }
      }
    };

    function showResult() {
      const roll = document.getElementById("rollInput").value;
      const student = results[roll];
      const section = document.getElementById("resultSection");
      if (student) {
        let html = `<h3>${student.name}</h3><ul>`;
        for (let subject in student.subjects) {
          html += `<li><strong>${subject}</strong>: ${student.subjects[subject]} নম্বর</li>`;
        }
        html += `</ul>`;
        section.innerHTML = html;
      } else {
        section.innerHTML = "<p style='color:red;'>এই রোল নম্বরের কোনো ফলাফল পাওয়া যায়নি।</p>";
      }
    }
  </script>
</body>
</html>
